config:
  target: 'http://localhost:5000' 
  phases:
    - duration: 15
      arrivalRate: 2 
      name: "اختبار استعلامات لوحة القيادة المعقدة تحت الضغط"
scenarios:
  - name: "محاكاة الفرونت إند (جلب إحصائيات بـ 3 طرق مختلفة)"
    flow:
      - post:
          url: "/api/auth/login"
          json:
            username: "elmostafa@200"
            password: "admin123456"
          capture:
            - json: "$.token"
              as: "auth_token"
      
      - get:
          url: "/api/dashboard/summary"
          headers:
            Authorization: "Bearer {{ auth_token }}"
            
      - get:
          url: "/api/dashboard/summary?startDate=2026-10-29&endDate=2026-10-29"
          headers:
            Authorization: "Bearer {{ auth_token }}"

      - get:
          url: "/api/dashboard/summary?startDate=2026-10-01&endDate=2026-10-31"
          headers:
            Authorization: "Bearer {{ auth_token }}"